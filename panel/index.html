<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Anaya Care</title><link rel="stylesheet" href="style.css"></head><body><header><strong>ANAYA CARE</strong><span>Administración</span><button id="logout" hidden>Cerrar sesión</button></header><main><section id="login"><p class="eyebrow">ACCESO PRIVADO</p><h1>Bienvenida a tu panel</h1><p>Consulta tus pedidos y el estado de sus pagos.</p><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button>Ingresar</button></form></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">ANAYA CARE</p><h1>Pedidos</h1><p>Revisa la actividad de tu tienda.</p></div><button id="refresh">Actualizar</button></div><div class="table-wrap" tabindex="0" role="region" aria-labelledby="orders-caption"><table><caption id="orders-caption">Pedidos recientes</caption><thead><tr><th scope="col">Fecha</th><th scope="col">Cliente</th><th scope="col">Contacto</th><th scope="col">Total</th><th scope="col">Pago</th><th scope="col">Productos</th></tr></thead><tbody id="orders"></tbody></table></div></section><p id="message" role="status" aria-live="polite"></p></main><script type="module" src="app.js"></script></body></html>
